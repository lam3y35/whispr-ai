name: Windows

# Adapted from per-simmons/murmur-youtube's windows.yml (MIT-style attribution:
# upstream carries no license file; this workflow is credited rather than claimed).
# The published exe is the only artifact CI can actually run, so --selftest is
# the smoke test: startup, native library resolution out of the bundle, model
# discovery.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build, test & self-test exe
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: windows

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: windows/global.json

      - name: Restore
        run: dotnet restore Murmur.sln

      # --no-incremental is required for -warnaserror to mean anything:
      # analyzer warnings are not re-emitted on incremental builds.
      - name: Build (warnings are errors)
        run: >-
          dotnet build Murmur.sln
          --no-restore
          --configuration Release
          --no-incremental
          -warnaserror

      - name: Test
        run: >-
          dotnet test Murmur.sln
          --no-build
          --configuration Release
          --logger "console;verbosity=normal"

      - name: Publish and self-test the exe
        shell: pwsh
        run: |
          dotnet publish src/Murmur.App/Murmur.App.csproj `
            --configuration Release --runtime win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            --output artifacts/publish
          $exe = 'artifacts/publish/WhisprAI.exe'
          if (-not (Test-Path $exe)) { throw "Published exe not found at $exe" }
          $size = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "published: $size MB"
          # Start-Process -Wait, not '&': WinExe does not block the console,
          # so $LASTEXITCODE would be stale and the gate would never fail.
          $run = Start-Process -FilePath $exe -ArgumentList '--selftest' -Wait -PassThru -NoNewWindow
          if ($run.ExitCode -ne 0) { throw "self-test failed with exit code $($run.ExitCode)" }

      - name: Upload the exe
        uses: actions/upload-artifact@v4
        with:
          name: WhisprAI-win-x64
          path: windows/artifacts/publish/WhisprAI.exe
          if-no-files-found: error
          compression-level: 0
