name: Release

# A tag push builds both apps the way a user installs them and publishes the
# binaries on a permanent, public GitHub Release. Artifacts on regular CI runs
# expire after 90 days and need login; Releases do not.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Re-running the workflow for an existing tag replaces its assets rather than
# duplicating the release (softprops handles "update existing" by default).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  # Secrets are not readable in `if:`; mirror them through env so the signing
  # step self-disables until real credentials are configured.
  AZURE_SIGNING_TENANT_ID: ${{ secrets.AZURE_SIGNING_TENANT_ID }}

jobs:
  android:
    name: Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK to the release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          fail_on_unmatched_files: true
          # Generated notes (commit lines since the previous tag) are created
          # in EXACTLY ONE place. Both jobs upload to the same release; the
          # action APPENDS its generated notes to any existing body, so two
          # jobs with this flag produced the changelog line twice on v0.1.1.
          generate_release_notes: true

  windows:
    name: Release exe
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: windows

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: windows/global.json

      - name: Restore
        run: dotnet restore Murmur.sln

      - name: Build (warnings are errors)
        run: >-
          dotnet build Murmur.sln
          --no-restore
          --configuration Release
          --no-incremental
          -warnaserror

      - name: Test
        run: >-
          dotnet test Murmur.sln
          --no-build
          --configuration Release
          --logger "console;verbosity=normal"

      - name: Publish and self-test the exe
        shell: pwsh
        run: |
          dotnet publish src/Murmur.App/Murmur.App.csproj `
            --configuration Release --runtime win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            --output artifacts/publish
          $exe = 'artifacts/publish/WhisprAI.exe'
          if (-not (Test-Path $exe)) { throw "Published exe not found at $exe" }
          $run = Start-Process -FilePath $exe -ArgumentList '--selftest' -Wait -PassThru -NoNewWindow
          if ($run.ExitCode -ne 0) { throw "self-test failed with exit code $($run.ExitCode)" }

      - name: Sign the exe (no-op until signing secrets are configured)
        if: env.AZURE_SIGNING_TENANT_ID != ''
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_SIGNING_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_SIGNING_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_SIGNING_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          code-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\windows\artifacts\publish
          files-folder-filter: exe

      - name: Upload exe to the release
        uses: softprops/action-gh-release@v2
        with:
          files: windows/artifacts/publish/WhisprAI.exe
          fail_on_unmatched_files: true
          # No generate_release_notes here: the APK job owns notes (see the
          # comment there). If this job creates the release first, the APK
          # job appends the notes; appending twice is what duplicated the
          # changelog on v0.1.1.
